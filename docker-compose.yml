services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: st_db
    volumes:
      - st-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 24

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: mysql://root:${MARIADB_ROOT_PASSWORD}@db:3306/st_db
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      DIGEST_LANG: ${DIGEST_LANG:-en}
      # leaving TELEGRAM_* unset disables the bot (sends fall back to logs);
      # set them in .env to turn Telegram capture on
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  st-data:
